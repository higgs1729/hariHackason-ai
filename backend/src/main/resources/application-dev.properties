# Dev-only settings. Activated by spring.profiles.active in application.properties.
#
# /api/dev/** is open in SecurityConfig, which is only safe because the
# controllers behind it are @Profile("dev") and therefore absent elsewhere.
# Before this is ever deployed anywhere real, drop the active profile.

logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true
