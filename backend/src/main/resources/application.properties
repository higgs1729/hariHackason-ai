spring.application.name=backend
server.port=8080

# The demo is reached through an HTTPS tunnel, so the request Spring sees is
# plain http://localhost:8080. Without this the share URL handed to
# navigator.share would point at localhost and the link would be dead on
# any other device.
server.forward-headers-strategy=framework

# The hackathon has no other environment, so dev is the default: /api/dev/seed
# must exist for the demo to be rebuildable after a restart. Drop this before
# deploying anywhere real.
spring.profiles.active=dev

# MySQL 8, started by docker-compose.yml at the repo root.
spring.datasource.url=jdbc:mysql://localhost:3306/hanamizuki?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=hanamizuki
spring.datasource.password=hanamizuki
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# backend/sql/create_table.sql is the only definition of the schema.
# `update` would let Hibernate derive a second one from the entities, and then
# neither would be authoritative. `validate` catches entity/table drift at
# startup instead of at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Column names are camelCase in the DDL and camelCase on the fields, so the
# default strategy (which would emit user_account) has to be turned off.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=200MB

app.storage.root=./storage
app.cluster.gap-minutes=30
app.cluster.max-photos-per-request=12
# Which provider the two AI features go through: anthropic | openrouter.
#
# OpenRouter exists here because there was no ANTHROPIC_API_KEY. It speaks the
# OpenAI chat shape rather than Anthropic's, so it is a second implementation
# of AlbumEnricher and ShootHinter, not a base-URL swap. Prompts and validation
# are shared; only the wire format differs.
app.ai.provider=${APP_AI_PROVIDER:anthropic}

# Used when provider=anthropic.
app.ai.model=claude-opus-4-8

# Used when provider=openrouter.
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
# First entry is the model of record; the rest are what OpenRouter falls back
# to if one is unavailable. Deliberately across vendors - if Anthropic is
# having an afternoon mid-demo the album still gets written by somebody, and
# the rule-based text stays the last resort rather than the first thing seen.
# Every slug here was checked against GET /api/v1/models for image input and
# structured output on 2026-09-26.
app.ai.openrouter.models=anthropic/claude-sonnet-5,google/gemini-3.8-flash,openai/gpt-6-luna-pro
# 25s, not 60: a cluster that has not answered by then will not save the demo,
# and the user is watching a spinner the whole time.
app.ai.timeout-seconds=25
app.ai.max-image-long-edge=1080

# The shoot hint is a separate budget from the album's. The user is standing
# still holding a pose while this runs, so it gives up sooner and shows the
# canned text instead.
app.ai.hint-timeout-seconds=8
# Per user, per window. This route costs money on every call and sits on the
# camera screen, one tap away from being pressed repeatedly.
#
# 30, not 10: a group shooting for a while taps this once per round, and 10
# was reachable by hand in one sitting. The limit is here to stop a runaway
# client, not to ration a person -- and a 429 during the demo would cost more
# than the calls it saved. No images go up, so each call is small.
app.ai.hint-rate-limit=30
app.ai.hint-rate-window-seconds=300
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=30

# Dev default only. Real value comes from APP_JWT_SECRET in .env, which is
# git-ignored; HS256 needs at least 32 bytes.
app.jwt.secret=${APP_JWT_SECRET:hanamizuki-dev-secret-change-me-0123456789}

# Blank means the AI step is skipped and albums fall back to rule-based
# titles. Real value comes from ANTHROPIC_API_KEY in .env (git-ignored).
app.ai.api-key=${ANTHROPIC_API_KEY:}
