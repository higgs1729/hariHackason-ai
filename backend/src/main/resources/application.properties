spring.application.name=backend
server.port=8080

# The hackathon has no other environment, so dev is the default: /api/dev/seed
# must exist for the demo to be rebuildable after a restart. Drop this before
# deploying anywhere real.
spring.profiles.active=dev

# MySQL 8, started by docker-compose.yml at the repo root.
spring.datasource.url=jdbc:mysql://localhost:3306/hanamizuki?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
spring.datasource.username=hanamizuki
spring.datasource.password=hanamizuki
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# backend/sql/create_table.sql is the only definition of the schema.
# `update` would let Hibernate derive a second one from the entities, and then
# neither would be authoritative. `validate` catches entity/table drift at
# startup instead of at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Column names are camelCase in the DDL and camelCase on the fields, so the
# default strategy (which would emit user_account) has to be turned off.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=200MB

app.storage.root=./storage
app.cluster.gap-minutes=30
app.cluster.max-photos-per-request=12
app.ai.model=claude-opus-4-8
# 25s, not 60: a cluster that has not answered by then will not save the demo,
# and the user is watching a spinner the whole time.
app.ai.timeout-seconds=25
app.ai.max-image-long-edge=1080
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=30

# Dev default only. Real value comes from APP_JWT_SECRET in .env, which is
# git-ignored; HS256 needs at least 32 bytes.
app.jwt.secret=${APP_JWT_SECRET:hanamizuki-dev-secret-change-me-0123456789}

# Blank means the AI step is skipped and albums fall back to rule-based
# titles. Real value comes from ANTHROPIC_API_KEY in .env (git-ignored).
app.ai.api-key=${ANTHROPIC_API_KEY:}
