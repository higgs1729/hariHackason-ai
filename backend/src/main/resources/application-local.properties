# Smoke-test profile: runs with no Docker and no MySQL.
#
# Hibernate builds the tables from the entities here, so this proves the
# context assembles and the endpoints work -- it does NOT prove the entities
# match backend/sql/create_table.sql. Only MySQL with ddl-auto=validate does.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,dev
#
# NON_KEYWORDS=USER because H2 reserves USER and one of our tables is named
# exactly that. MySQL does not reserve it, which is why the DDL can.
spring.datasource.url=jdbc:h2:mem:hanamizuki;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.storage.root=./storage-local
